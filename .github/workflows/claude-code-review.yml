name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "dist/**"
      - "example/dist/**"
      - "generated/**"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in the
            working directory, and `scripts/path-controller` is a checked-out submodule.

            Read CLAUDE.md and documentation/proseStyle.md first: they are the
            project's rules, and a change that breaks one is a finding.

            Focus on, in order:
            - Correctness bugs: wrong behavior, broken edge cases, lifecycle leaks
              (path watchers, event listeners, modal ToolOps that keep widget pointers)
            - Broken CLAUDE.md rules, especially: no `any` outside JSON.parse, CTX and
              SELF generics threaded through UIBase subclasses, new names leaking into
              the `pathux` barrel through `export *`, ToolOps that are not undoable,
              widgets that track drags themselves instead of spawning a modal ToolOp,
              comment rules (`//` notes at most 3 lines, no leftover `CLAUDENOTE:`)
            - Missing or weakened tests for changed behavior

            Do not comment on formatting (prettier owns it) or offer praise.
            Put each specific issue in an inline comment on the line it concerns.
            Finish with one short top-level comment that summarizes the findings, or
            says the review found nothing, using `gh pr comment`.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
